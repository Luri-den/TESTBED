<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map Tools</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="app/editor.css">
</head>
<body class="ed-tools">
<!--
  ETS Community Map: Tools. QR signs, icons (draw your own or bring an SVG), hand-drawn marker shapes, and the Building Designer.
  Changes are kept in this browser until you press Publish, the same as the editor.
-->
<header class="ed-top">
  <a class="ed-brand" id="edBrand" href="edit.html" title="Back to the Editor"><span class="ed-badge" id="edBadge"></span><b id="edName">Map Tools</b></a>
  <nav class="ed-tabs" id="edTabs" aria-label="Tools"></nav>
  <span class="ed-grow"></span>
  <span class="ed-saved" id="edSaved" hidden></span>
  <a class="ed-btn" href="edit.html" id="edBack">Back to the Editor</a>
  <button type="button" class="ed-btn" id="edUndo" disabled>Undo</button>
  <button type="button" class="ed-btn" id="edPreview" hidden>Preview</button>
  <button type="button" class="ed-btn ed-primary" id="edPublish">Publish <span class="ed-count" id="edCount" hidden>0</span></button>
</header>
<div class="ed-event" id="edEvent" hidden></div>
<main class="ed-main">
  <aside class="ed-side" id="edSide" aria-label="Tool"></aside>
  <section class="ed-mapwrap" hidden><div id="edMap" class="ed-map"></div><div class="ed-mode" id="edMode" hidden></div><div class="ed-mapbtns"><button type="button" class="ed-round" id="edAerial">Aerial</button></div></section>
  <aside class="ed-insp" id="edInsp" aria-label="Workspace" hidden></aside>
</main>
<div class="ed-toast" id="edToast" role="status" aria-live="polite" hidden></div>
<div class="ed-modal-back" id="edModal" hidden></div>
<script src="app/qrcode-lite.js"></script>
<script src="app/ed-core.js"></script>
<script src="app/tools.js"></script>
<script>ETSEditor.start();</script>
</body>
</html>
